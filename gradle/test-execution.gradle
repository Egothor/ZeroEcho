import java.time.Duration
import java.util.concurrent.atomic.AtomicBoolean
import org.gradle.api.tasks.testing.Test
import org.gradle.api.tasks.testing.TestResult

// One policy also covers samples and buildSrc, which do not use every module convention.
allprojects {
    tasks.withType(Test).configureEach { Test testTask ->
        failFast = true
        timeout = Duration.ofMinutes(15)
        testLogging {
            events 'started', 'failed', 'skipped'
            exceptionFormat = 'full'
        }
        // Custom event callbacks are limited to the watchdog invocation, which
        // explicitly disables configuration caching. Ordinary Test tasks retain it.
        if (providers.gradleProperty('releaseWatchdog').getOrElse('false') == 'true') {
            def failureReported = new AtomicBoolean()
            def reportFailure = { descriptor, result ->
                if (result.resultType == TestResult.ResultType.FAILURE
                        && failureReported.compareAndSet(false, true)) {
                    // Include container/lifecycle failures, which may have no individual test event.
                    logger.error("ZEROECHO_TEST_FAILURE ${testTask.path} ${descriptor.className} > ${descriptor.name}")
                }
            }
            afterTest(reportFailure)
            afterSuite(reportFailure)
        }
    }
}
