###############################################################################
# ZeroEcho PKI UI edge — main nginx configuration.
#
# Topology:   browser  --mTLS-->  nginx  --mTLS-->  pki-server (admin listener)
#
# nginx TERMINATES the browser's client certificate (ssl_verify_client on) and
# re-presents the verified leaf to pki-server as an RFC 9440 `Client-Cert`
# header, so pki-server runs in TRUSTED_REVERSE_PROXY mode. nginx itself
# authenticates to pki-server with its own transport client certificate.
#
# RFC 9440 requires the header value to be a Structured-Fields Byte Sequence:
# `:` + base64(DER) + `:`. Stock nginx only exposes the client certificate as PEM
# ($ssl_client_cert) or URL-escaped PEM ($ssl_client_escaped_cert) — NOT
# base64(DER). We therefore use njs (client_cert.js) to strip the PEM armor and
# emit the canonical RFC 9440 value. This matches pki-server's strict RFC9440
# parser (ForwardedClientCertificateParser.byteSequence).
#
# NOT VALIDATED WITH `nginx -t` (no nginx binary / container engine available in
# the authoring environment). Kept syntactically conventional and careful.
###############################################################################

# njs dynamic module (installed from nginx-module-njs in the image).
load_module modules/ngx_http_js_module.so;

user  nginx;
worker_processes  auto;
pid   /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    log_format main '$remote_addr - $ssl_client_s_dn [$time_iso8601] '
                    '"$request" $status $body_bytes_sent rt=$request_time '
                    'urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log main;
    error_log   /var/log/nginx/error.log warn;

    # --- RFC 9440 client-certificate forwarding (njs) ------------------------
    js_path       "/etc/nginx/njs/";
    js_import     client_cert from client_cert.js;
    # Verified browser leaf certificate as an RFC 9440 byte sequence, or "".
    js_set        $rfc9440_client_cert  client_cert.rfc9440Leaf;

    # Rendered site server block(s) produced by the official nginx entrypoint
    # from /etc/nginx/templates/*.template via envsubst (see Dockerfile).
    include /etc/nginx/conf.d/*.conf;

    # --- Container-local health endpoint (plaintext, loopback only) ----------
    # Used by the image HEALTHCHECK to prove nginx itself is serving; it does not
    # expose anything and is not reachable off-box.
    server {
        listen 127.0.0.1:8080;
        server_name _;
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain always;
            return 200 "ok\n";
        }
        location / { return 404; }
    }
}
