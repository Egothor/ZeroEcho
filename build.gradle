import zeroecho.buildlogic.AssembleDocumentationSite

// Match isolated verification output selection without changing normal build paths.
providers.gradleProperty('verificationOutputRoot').orNull?.with { outputRoot ->
    if (outputRoot.isBlank() || !new File(outputRoot).isAbsolute()) {
        throw new GradleException('verificationOutputRoot must be a nonblank absolute path')
    }
    layout.buildDirectory.set(new File(outputRoot, project.name))
}

def documentationSite = tasks.register('assembleDocumentationSite', AssembleDocumentationSite) {
    group = 'documentation'
    description = 'Assembles the built MkDocs site and all enabled module Javadocs for GitHub Pages.'
    mkDocsDirectory = layout.projectDirectory.dir('site')
    destinationDirectory = layout.buildDirectory.dir('documentation-site')
    modules.convention([])
}

// Resolve conventions after every module has configured its real Javadoc task.
// In particular, samples intentionally disables Javadoc and contains tests only.
gradle.projectsEvaluated {
    subprojects.sort { it.path }.each { module ->
        if (module.plugins.hasPlugin('java')) {
            def javadoc = module.tasks.named('javadoc', Javadoc)
            if (javadoc.get().enabled) {
                def input = objects.newInstance(AssembleDocumentationSite.ModuleJavadoc)
                input.name.set(module.name)
                input.directory.fileProvider(javadoc.map { it.destinationDir })
                documentationSite.configure {
                    dependsOn javadoc
                    modules.add(input)
                }
            }
        }
    }
}
