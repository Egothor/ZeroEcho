/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    // Apply the java Plugin to add support for Java.
    id 'java'
    id 'maven-publish'
    id 'pmd'
    // Give non-modular third-party jars a stable module name for the module path.
    id 'org.gradlex.extra-java-module-info'
}

// conflux ships no module descriptor and no Automatic-Module-Name; name it explicitly
// so the modular main source sets can `requires conflux`.
extraJavaModuleInfo {
    failOnMissingModuleInfo = false
    automaticModule('org.egothor:conflux', 'conflux')
}

import java.time.LocalDate

def currentYear = LocalDate.now().getYear()

// git-version plugin removed for a source-only checkout without a .git directory.
project.version = '0.0.0-LOCAL'

repositories {
    
    maven {
        name = "GiteaMaven"
        url = uri("https://gitea.egothor.org/api/packages/Egothor/maven")
    }
    
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    constraints {
        // Define dependency versions as constraints
        implementation 'org.apache.commons:commons-text:1.15.0'
        implementation 'commons-cli:commons-cli:1.11.0'
        implementation 'org.bouncycastle:bcpkix-jdk18on:1.84'
        implementation 'org.egothor:conflux:[1.0,2.0)'
        implementation 'org.apache.commons:commons-imaging:1.0.0-alpha6'
    }

    // Use JUnit Jupiter for testing.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

pmd {
	consoleOutput = true
	toolVersion = '7.20.0'
	sourceSets = [sourceSets.main]
	ruleSetFiles = files(rootProject.file(".ruleset"))
}

tasks.withType(Pmd) {
    maxHeapSize = "16g"
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// JPMS: the main source set carries a module-info.java and is compiled/validated on
// the module path. Tests and auxiliary source sets have no descriptor and run on the
// classpath (unnamed module) — this keeps JUnit/Mockito deep reflection and the
// existing ServiceLoader-via-META-INF/services behaviour working without changes, and
// preserves the supported classpath distribution alongside the modular one.
tasks.withType(JavaCompile).configureEach {
    if (name != 'compileJava') {
        modularity.inferModulePath = false
    } else {
        // A qualified `exports ... to <sibling>` directive names a downstream
        // module (e.g. zeroecho.pki.server, zeroecho.app) that depends on this
        // module and is therefore never on this module's own compile module path.
        // javac's `module` lint cannot resolve those targets and emits an
        // unavoidable "module not found" warning for a legitimate, intentional
        // export. Disable only that lint category; every other category stays on.
        options.compilerArgs.add('-Xlint:-module')
    }
}
tasks.withType(Test).configureEach {
    modularity.inferModulePath = false
}
tasks.withType(JavaExec).configureEach {
    modularity.inferModulePath = false
}

// Architecture gate (Task 13a): BouncyCastle is an implementation detail confined to
// the `lib` module. Any other module referencing org.bouncycastle in its main sources
// fails the build. This makes the confinement machine-enforced, not just a convention.
if (project.name != 'lib') {
    def verifyBouncyCastleConfinement = tasks.register('verifyBouncyCastleConfinement') {
        group = 'verification'
        description = 'Fails if this non-lib module references org.bouncycastle in src/main/java.'
        def mainSources = fileTree('src/main/java') { include '**/*.java' }
        inputs.files(mainSources).withPropertyName('mainSources').optional(true)
        def marker = layout.buildDirectory.file('verification/bouncycastle-confinement.ok')
        outputs.file(marker)
        doLast {
            def offenders = mainSources.files.findAll { it.text.contains('org.bouncycastle') }
            if (!offenders.isEmpty()) {
                throw new GradleException(
                    "BouncyCastle must be confined to :lib, but ${project.name} references org.bouncycastle in:\n  "
                        + offenders.collect { it.absolutePath }.join('\n  '))
            }
            def out = marker.get().asFile
            out.parentFile.mkdirs()
            out.text = "ok\n"
        }
    }
    tasks.named('check').configure { dependsOn verifyBouncyCastleConfinement }
}

javadoc {
    failOnError = true

    options.addStringOption('Xdoclint:all', '-quiet')
    options.addStringOption('Xmaxwarns', '10000')
    options.addBooleanOption('html5', true)
    options.tags('apiNote:a:API Note:')
    options.tags('implSpec:a:Implementation Requirements:')
    options.tags('implNote:a:Implementation Note:')
    options.tags('param')
    options.tags('return')
    options.tags('throws')
    options.tags('since')
    options.tags('version')
    options.tags('serialData')
    options.tags('factory')
    options.tags('see')
    
    options.use = true
    options.author = true
    options.version = true
    options.windowTitle = 'ZeroEcho'
    options.docTitle = 'ZeroEcho API'
    
    options.bottom = '<div style="text-align: right; padding: 5px;">Copyright &copy; ' + currentYear +
                     ' Egothor - Version ' + version +
                     ' - <a href="https://gitea.egothor.org/Egothor/ZeroEcho/raw/branch/main/LICENSE">License</a>' +
                     '</div>'
                     	
    source = sourceSets.main.allJava
}

task uploadJavadoc(type: Exec) {
    dependsOn javadoc

    doFirst {
        def javadocDir = tasks.javadoc.destinationDir
        def relativeJavadocDir = project.projectDir.toPath().relativize(javadocDir.toPath()).toString()
        def moduleName = project.name  // Dynamically get the module name

        println "Uploading Javadoc for module: ${moduleName}"
        println "Uploading from relative path: $relativeJavadocDir"

        // Upload to a folder named after the module
        commandLine "rsync", "-avz", "--delete",
          "-e", "ssh -i ${javadocKeyPath} -o IdentitiesOnly=yes",
          relativeJavadocDir + '/', "${javadocUser}@${javadocHost}:${javadocPath}/${project.name}"
    }
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

if (project.hasProperty('giteaToken') && project.giteaToken) {
    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
                artifactId = "${rootProject.name}-${project.name}"
            }
        }
        repositories {
            maven {
                name = "GiteaMaven"
                url = uri("https://gitea.egothor.org/api/packages/Egothor/maven")

                credentials(HttpHeaderCredentials) {
                    name = "Authorization"
                    value = "token ${giteaToken}"
                }

                authentication {
                    header(HttpHeaderAuthentication)
                }
            }
        }
    }
} else {
    println "No giteaToken defined - skipping publishing configuration"
}

