plugins {
    // Support convention plugins written in Groovy. Convention plugins are build scripts in 'src/main' that automatically become available as plugins in the main build.
    id 'groovy-gradle-plugin'
}


// Isolated verification can use fresh outputs without touching existing reports.
providers.gradleProperty('verificationOutputRoot').orNull?.with { outputRoot ->
    if (outputRoot.isBlank() || !new File(outputRoot).isAbsolute()) {
        throw new GradleException('verificationOutputRoot must be a nonblank absolute path')
    }
    layout.buildDirectory.set(new File(outputRoot, project.name))
}

repositories {
    // Use the plugin portal to apply community plugins in convention plugins.
    gradlePluginPortal()
}

dependencies {
    // Assign a module name to non-modular third-party jars (e.g. conflux) so they
    // can be placed on the module path for JPMS compilation of the main sources.
    implementation 'org.gradlex:extra-java-module-info:1.13'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Build plugins follow the same warning policy as application and test sources.
tasks.withType(JavaCompile).configureEach {
    options.warnings = true
    options.compilerArgs.addAll(['-Xlint:all', '-Xmaxwarns', '100000'])
    if (providers.gradleProperty('warningsAsErrors').getOrElse('true') != 'false') {
        options.compilerArgs.add('-Werror')
    }
}
