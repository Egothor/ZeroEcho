plugins {
    id 'buildlogic.java-library-conventions'
}

group = 'org.egothor'

dependencies {
    // Build-time generator consumes the validated server catalog directly.
    implementation project(':pki')
    implementation project(':pki-server')
}

def supplementFile = file('src/main/resources/openapi-supplement.yaml')
def outputDir = layout.buildDirectory.dir('openapi').get().asFile
def outputFile = new File(outputDir, 'zeroecho-admin-api.yaml')

tasks.register('generateOpenApi', JavaExec) {
    group = 'documentation'
    description = 'Generates the OpenAPI 3.1 specification from the PKI operation registry.'
    dependsOn ':pki:classes', ':pki-server:classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'zeroecho.apispec.OpenApiGenerator'
    args = [
        rootProject.version.toString(),
        supplementFile.absolutePath,
        outputFile.absolutePath
    ]
    inputs.files(project(':pki').sourceSets.main.allSource)
        .withPropertyName('pkiSources')
    inputs.files(project(':pki-server').sourceSets.main.allSource)
        .withPropertyName('pkiServerSources')
    inputs.file(supplementFile).withPropertyName('supplement')
    outputs.file(outputFile)
    doFirst {
        outputDir.mkdirs()
    }
}
