plugins {
    id 'buildlogic.java-application-conventions'
}

group='org.egothor'

dependencies {
    implementation 'org.apache.commons:commons-text'
    implementation 'commons-cli:commons-cli'
    implementation platform('tools.jackson:jackson-bom:3.1.5')
    implementation 'tools.jackson.core:jackson-core'
    implementation project(':lib')
    implementation project(':ext')
    implementation project(':pki')
}

application {
    // Define the main class for the application.
    mainClass = 'zeroecho.ZeroEcho'
}

// Bundle the generated operation parameter schema as a CLI classpath resource.
tasks.named('processResources') {
    dependsOn(':pki-server:generateSchema')
    from(project(':pki-server').layout.buildDirectory.file('generated/schema/operationSchema.json')) {
        into 'schema'
    }
}

// Thin module jar. The runnable distribution is produced by the application
// plugin (installDist / distZip), which places each dependency on the classpath;
// dependencies are never bundled into this jar.
jar {
    manifest {
        attributes(
            'Main-Class': application.mainClass,
            'Implementation-Title': rootProject.name,
            'Implementation-Version': "${version}"
        )
    }
}

javadoc {
    dependsOn ':lib:javadoc'
    options.linksOffline("../lib/",
            project(':lib').layout.buildDirectory.dir('docs/javadoc').get().asFile.absolutePath)
}

// Deployment-only profile seeding entry point, outside the public CLI catalog.
// Reuse the application plugin's runtime classpath and script generator.
def profileBootstrapScripts = tasks.register('profileBootstrapScripts', CreateStartScripts) {
    applicationName = 'zeroecho-pki-profile-bootstrap'
    mainClass = 'zeroecho.pki.cli.PkiProfileBootstrap'
    outputDir = layout.buildDirectory.dir('profile-bootstrap-scripts').get().asFile
    classpath = tasks.named('startScripts').get().classpath
}

// Deployment-only publisher secrets management tool, outside the public CLI catalog.
def publisherSecretsScripts = tasks.register('publisherSecretsScripts', CreateStartScripts) {
    applicationName = 'zeroecho-pki-publisher-secrets'
    mainClass = 'zeroecho.pki.cli.PublisherSecretsManagerCli'
    outputDir = layout.buildDirectory.dir('publisher-secrets-scripts').get().asFile
    classpath = tasks.named('startScripts').get().classpath
}
distributions {
    main {
        contents {
            from(profileBootstrapScripts) {
                into 'bin'
                filePermissions { unix('rwxr-xr-x') }
            }
            from(publisherSecretsScripts) {
                into 'bin'
                filePermissions { unix('rwxr-xr-x') }
            }
        }
    }
}

// Test-only local recovery and performance gates; ordinary unit tests remain independent of installed processes.
tasks.named('test') {
    useJUnitPlatform { excludeTags 'packaged-local-recovery', 'local-performance' }
}

['packagedLocalRecoveryTest': 'packaged-local-recovery', 'localPerformanceTest': 'local-performance'].each { taskName, tag ->
    tasks.register(taskName, Test) {
        group = 'verification'
        description = tag == 'local-performance'
                ? 'Records informational local/reactive signing and packaged startup samples without performance thresholds.'
                : 'Verifies process-interrupted local signing recovery through the installed public CLI.'
        dependsOn tasks.named('testClasses'), tasks.named('installDist')
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform { includeTags tag }
        systemProperty 'pki.validation.executable', layout.buildDirectory.file('install/app/bin/app').get().asFile.absolutePath
        systemProperty 'pki.validation.output', rootProject.layout.buildDirectory.dir("pki-validation/${tag}").get().asFile.absolutePath
        maxParallelForks = 1
        outputs.upToDateWhen { false }
    }
}
