plugins {
    id 'buildlogic.java-application-conventions'
}

group='org.egothor'

dependencies {
    implementation 'org.apache.commons:commons-text'
    implementation 'commons-cli:commons-cli'
    implementation platform('tools.jackson:jackson-bom:3.1.5')
    implementation 'tools.jackson.core:jackson-core'
    implementation project(':lib')
    implementation project(':ext')
    implementation project(':pki')
}

application {
    // Define the main class for the application.
    mainClass = 'zeroecho.ZeroEcho'
}

// Thin module jar. The runnable distribution is produced by the application
// plugin (installDist / distZip), which places each dependency on the classpath;
// dependencies are never bundled into this jar.
jar {
    manifest {
        attributes(
            'Main-Class': application.mainClass,
            'Implementation-Title': rootProject.name,
            'Implementation-Version': "${version}"
        )
    }
}

javadoc {
    options.links("https://www.egothor.org/javadoc/zeroecho/lib")
}
