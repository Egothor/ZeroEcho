###############################################################################
# ZeroEcho PKI \u2013 JUL logging configuration
#
# This configuration is intentionally conservative:
#  - console logging only
#  - no sensitive data
#  - readable, timestamped output
#  - suitable for bootstrap and early lifecycle phases
###############################################################################

# Global handlers
handlers=java.util.logging.ConsoleHandler

# Default global level
.level=INFO

###############################################################################
# Console handler
###############################################################################

java.util.logging.ConsoleHandler.level=INFO
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter

# ISO-like timestamp, level, logger, message
java.util.logging.SimpleFormatter.format=%1$tF %1$tT %4$s [%3$s] %5$s%6$s%n

###############################################################################
# Package-specific levels
###############################################################################

# PKI bootstrap and internals
zeroecho.pki.level=INFO

# Public API (defensive: do not accidentally enable verbose logging)
zeroecho.pki.api.level=INFO

###############################################################################
# Hard safety defaults
###############################################################################

# Never enable FINE/FINER/FINEST globally by default.
# If needed for diagnostics, raise levels explicitly and temporarily.
