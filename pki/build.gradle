plugins {
    id 'buildlogic.java-application-conventions'
}

group='org.egothor'

dependencies {
    implementation 'org.apache.commons:commons-text'
    implementation 'commons-cli:commons-cli'
    implementation platform('tools.jackson:jackson-bom:3.1.5')
    implementation 'tools.jackson.core:jackson-core'
    implementation project(':lib')
}

application {
    // Define the main class for the application.
    mainClass = 'zeroecho.pki.PkiApplication'
}

sourceSets {
    signingPerformance {
        java.srcDir 'src/signingPerformance/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
    signingPerformanceTest {
        java.srcDir 'src/signingPerformanceTest/java'
        compileClasspath += sourceSets.main.output + sourceSets.signingPerformance.output
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    signingPerformanceImplementation.extendsFrom implementation
    signingPerformanceRuntimeOnly.extendsFrom runtimeOnly
    signingPerformanceTestImplementation.extendsFrom testImplementation, signingPerformanceImplementation
    signingPerformanceTestRuntimeOnly.extendsFrom testRuntimeOnly, signingPerformanceRuntimeOnly
}

tasks.register('signingPerformanceBenchmark', JavaExec) {
    group = 'verification'
    description = 'Runs the explicitly opt-in open-loop signing persistence macrobenchmark.'
    dependsOn tasks.named('signingPerformanceClasses')
    classpath = sourceSets.signingPerformance.runtimeClasspath
    mainClass = 'zeroecho.pki.performance.SigningPerformanceBenchmark'
    maxHeapSize = providers.gradleProperty('signingBenchmarkHeap').getOrElse('4g')
    jvmArgs '-XX:+UseG1GC'

    // Opt-in Java Flight Recorder capture for bottleneck analysis; inert unless requested.
    providers.gradleProperty('signingBenchmarkJfr').orNull?.with { jfrFile ->
        jvmArgs "-XX:StartFlightRecording=settings=profile,dumponexit=true,filename=${jfrFile}"
    }

    def benchmarkProperties = [
        'profile', 'target', 'cellId', 'cellMode', 'retainedPopulation', 'activePopulation', 'groupSize',
        'residentIndexBudgetBytes', 'compactionTransientBudgetBytes',
        'warmupSeconds', 'durationSeconds', 'rate', 'lanes',
        'queueCapacity', 'providerMeanMillis', 'providerJitterMillis',
        'payloadBytes', 'sampleCapacity', 'drainSeconds', 'seed', 'output',
        'workRoot', 'diagnosticEnvironmentOverride'
    ]
    benchmarkProperties.each { propertyName ->
        providers.gradleProperty("signingBenchmark${propertyName.capitalize()}").orNull?.with { value ->
            args "--${propertyName}=${value}"
        }
    }
}

tasks.register('signingActiveWalBenchmark', JavaExec) {
    group = 'verification'
    description = 'Runs the opt-in active-WAL group-commit characterization.'
    dependsOn tasks.named('signingPerformanceClasses')
    classpath = sourceSets.signingPerformance.runtimeClasspath
    mainClass = 'zeroecho.pki.impl.fs.SigningActiveWalBenchmark'
    maxHeapSize = providers.gradleProperty('signingActiveWalBenchmarkHeap').getOrElse('4g')

    def benchmarkProperties = [
        'warmupSeconds', 'durationSeconds', 'rate', 'fakeForce', 'output', 'workRoot'
    ]
    benchmarkProperties.each { propertyName ->
        providers.gradleProperty("signingActiveWalBenchmark${propertyName.capitalize()}").orNull?.with { value ->
            args "--${propertyName}=${value}"
        }
    }
}

tasks.register('signingRecoveryBenchmark', JavaExec) {
    group = 'verification'
    description = 'Prepares or reopens the opt-in controlled production-ledger recovery image.'
    dependsOn tasks.named('signingPerformanceClasses')
    classpath = sourceSets.signingPerformance.runtimeClasspath
    mainClass = 'zeroecho.pki.impl.fs.SigningRecoveryBenchmark'
    maxHeapSize = providers.gradleProperty('signingRecoveryBenchmarkHeap').getOrElse('4g')
    jvmArgs '-XX:+UseG1GC'

    ['mode', 'retainedPopulation', 'activePopulation', 'sealedSegments', 'suffixFrames',
     'createdAtEpochMilli', 'output', 'workRoot'].each { propertyName ->
        providers.gradleProperty("signingRecoveryBenchmark${propertyName.capitalize()}").orNull?.with { value ->
            args "--${propertyName}=${value}"
        }
    }
}

tasks.register('signingDueSelectionBenchmark', JavaExec) {
    group = 'verification'
    description = 'Runs the opt-in production-ledger due-selection diagnostic.'
    dependsOn tasks.named('signingPerformanceClasses')
    classpath = sourceSets.signingPerformance.runtimeClasspath
    mainClass = 'zeroecho.pki.impl.fs.SigningDueSelectionBenchmark'
    maxHeapSize = providers.gradleProperty('signingDueSelectionBenchmarkHeap').getOrElse('4g')
    jvmArgs '-XX:+UseG1GC'

    ['activePopulation', 'selectionBound', 'subsequentInProcessSamples',
     'environmentEvidenceSha256', 'output', 'workRoot'].each { propertyName ->
        providers.gradleProperty("signingDueSelectionBenchmark${propertyName.capitalize()}").orNull?.with { value ->
            args "--${propertyName}=${value}"
        }
    }
}

tasks.register('signingDirectMaintenanceBenchmark', JavaExec) {
    group = 'verification'
    description = 'Runs the opt-in direct signing-ledger maintenance diagnostic.'
    dependsOn tasks.named('signingPerformanceClasses')
    classpath = sourceSets.signingPerformance.runtimeClasspath
    mainClass = 'zeroecho.pki.impl.fs.SigningDirectMaintenanceBenchmark'
    maxHeapSize = providers.gradleProperty('signingDirectMaintenanceBenchmarkHeap').getOrElse('4g')
    jvmArgs '-XX:+UseG1GC'

    ['liveRecords', 'sourceGenerations', 'sealedSegments', 'firstGenerationIdentity',
     'checkpointIdentity', 'nextActiveIdentity', 'output', 'workRoot'].each { propertyName ->
        providers.gradleProperty("signingDirectMaintenanceBenchmark${propertyName.capitalize()}").orNull?.with { value ->
            args "--${propertyName}=${value}"
        }
    }
}

tasks.register('signingPerformanceAggregate', JavaExec) {
    group = 'verification'
    description = 'Verifies the fixed Increment-13 signing evidence bundle without running benchmarks.'
    dependsOn tasks.named('signingPerformanceClasses')
    classpath = sourceSets.signingPerformance.runtimeClasspath
    mainClass = 'zeroecho.pki.performance.SigningPerformanceEvidenceAggregator'

    [evidenceRoot: 'signingEvidenceRoot', output: 'signingEvidenceOutput'].each { argumentName, propertyName ->
        providers.gradleProperty(propertyName).orNull?.with { value ->
            args "--${argumentName}=${value}"
        }
    }
}

tasks.register('signingPerformanceSmoke', Test) {
    group = 'verification'
    description = 'Runs the fast deterministic contract test for the signing macrobenchmark.'
    testClassesDirs = sourceSets.signingPerformanceTest.output.classesDirs
    classpath = sourceSets.signingPerformanceTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
}

// pki is consumed as a library (by pki-server and app); its jar must be a thin
// module jar. Dependencies (BouncyCastle, jackson, lib, ...) are resolved from the
// module/class path, never bundled here.
jar {
    manifest {
        attributes(
            'Main-Class': application.mainClass,
            'Implementation-Title': rootProject.name,
            'Implementation-Version': "${version}"
        )
    }
}

javadoc {
    options.links("https://www.egothor.org/javadoc/zeroecho/lib")
}
