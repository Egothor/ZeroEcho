name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: documentation/requirements.txt
      - name: Install documentation tooling
        run: python -m pip install -r documentation/requirements.txt
      - name: Build MkDocs with strict validation
        run: python -m mkdocs build --strict
      - name: Test documentation assembly and build conventions
        run: ./gradlew -p buildSrc test --no-daemon
      - name: Generate all module Javadocs and assemble the combined site
        run: ./gradlew assembleDocumentationSite --no-daemon
      - name: Upload the complete site as one Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/documentation-site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated combined site
        id: deployment
        uses: actions/deploy-pages@v4
