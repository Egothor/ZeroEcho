plugins {
    id 'buildlogic.java-library-conventions'
    id 'application'
}

group = 'org.egothor'

configurations {
    mockitoAgent
}

dependencies {
    api project(':pki')
    implementation project(':lib')
    implementation platform('tools.jackson:jackson-bom:3.1.5')
    implementation 'tools.jackson.core:jackson-core'
    testImplementation 'org.bouncycastle:bcpkix-jdk18on:1.86'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    mockitoAgent('org.mockito:mockito-core:5.23.0') {
        transitive = false
    }
}

application {
    mainClass = 'zeroecho.pki.server.PkiServerMain'
    applicationName = 'zeroecho-pki-server'
}

tasks.named('test') {
    useJUnitPlatform { excludeTags 'frontend-integration', 'packaged-integration' }
    dependsOn tasks.named('installDist')
    def maintainedExamples = ['docs', 'documentation', 'deploy'].collect { directory ->
        rootProject.fileTree(directory) {
            include '**/*.json', '**/*.yaml', '**/*.yml', '**/*.md'
            exclude 'codex/**'
        }
    }
    inputs.files(maintainedExamples).withPropertyName('maintainedConfigurationExamples')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    systemProperty 'configurationExamples.repository', rootProject.projectDir.absolutePath
    systemProperty 'serverSpi.distributionLib', layout.buildDirectory.dir('install/zeroecho-pki-server/lib').get().asFile.absolutePath
    systemProperty 'server.distributionDirectory', tasks.named('installDist').get().destinationDir.absolutePath
    systemProperty 'serverSpi.legacyBaseline', providers.gradleProperty('serverSpiLegacyBaseline').getOrElse('')
    jvmArgs("-javaagent:${configurations.mockitoAgent.singleFile}")
}

jar {
    manifest {
        attributes(
            'Main-Class': application.mainClass,
            'Implementation-Title': 'ZeroEcho PKI Server',
            'Implementation-Version': "${version}"
        )
    }
}

javadoc {
    dependsOn ':lib:javadoc', ':pki:javadoc'
    options.linksOffline("../lib/",
            project(':lib').layout.buildDirectory.dir('docs/javadoc').get().asFile.absolutePath)
    options.linksOffline("../pki/",
            project(':pki').layout.buildDirectory.dir('docs/javadoc').get().asFile.absolutePath)
}

tasks.register('generateSchema', JavaExec) {
    description = 'Generates the machine-readable operation parameter schema JSON and TypeScript artefact.'
    group = 'build'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'zeroecho.pki.server.schema.GenerateOperationSchema'
    def jsonOut = layout.buildDirectory.file('generated/schema/operationSchema.json').get().asFile
    def tsOut = layout.buildDirectory.file('generated/schema/operationSchema.generated.ts').get().asFile
    args jsonOut.absolutePath, tsOut.absolutePath
    inputs.files(sourceSets.main.output)
    outputs.files(jsonOut, tsOut)
}

// Explicit browser gate: ordinary JVM tests never require Node or a browser.
tasks.register('frontendIntegrationTest', Test) {
    description = 'Runs the built SPA against a temporary real PKI HTTPS backend.'
    group = 'verification'
    dependsOn tasks.named('testClasses'), ':pki-frontend:npmBuild'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'frontend-integration' }
    systemProperty 'frontend.directory', project(':pki-frontend').projectDir.absolutePath
    doFirst {
        def frontendNode = project(':pki-frontend').extensions.getByName('node')
        def nodeDirectory = frontendNode.resolvedNodeDir.get().asFile
        def executable = new File(nodeDirectory, frontendNode.resolvedPlatform.get().isWindows() ? 'node.exe' : 'bin/node')
        systemProperty 'frontend.node', providers.gradleProperty('frontendNode').getOrElse(executable.absolutePath)
    }
    systemProperty 'frontend.browser', providers.gradleProperty('frontendBrowser').getOrElse('')
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
}

// Explicit distribution/container gate; no image pull or build occurs inside the test.
tasks.register('packagedIntegrationTest', Test) {
    description = 'Verifies packaged nginx, PKI server, SPA and CLI through real mTLS.'
    group = 'verification'
    dependsOn tasks.named('testClasses'), ':app:installDist'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'packaged-integration' }
    systemProperty 'packaged.repository', rootProject.projectDir.absolutePath
    systemProperty 'packaged.serverImage', providers.gradleProperty('packagedServerImage').getOrElse('localhost/zeroecho-pki-server:integration-test')
    systemProperty 'packaged.nginxImage', providers.gradleProperty('packagedNginxImage').getOrElse('localhost/zeroecho-pki-nginx:integration-test')
    systemProperty 'frontend.browser', providers.gradleProperty('frontendBrowser').getOrElse('')
    doFirst {
        def frontendNode = project(':pki-frontend').extensions.getByName('node')
        def nodeDirectory = frontendNode.resolvedNodeDir.get().asFile
        def executable = new File(nodeDirectory, frontendNode.resolvedPlatform.get().isWindows() ? 'node.exe' : 'bin/node')
        systemProperty 'frontend.node', providers.gradleProperty('frontendNode').getOrElse(executable.absolutePath)
    }
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
}
