import zeroecho.buildlogic.FrontendTestArguments

plugins {
    id 'buildlogic.java-library-conventions'
    id 'application'
}

group = 'org.egothor'

configurations {
    mockitoAgent
}

dependencies {
    api project(':pki')
    implementation project(':lib')
    implementation platform('tools.jackson:jackson-bom:3.1.5')
    implementation 'tools.jackson.core:jackson-core'
    testImplementation 'org.bouncycastle:bcpkix-jdk18on:1.86'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    mockitoAgent('org.mockito:mockito-core:5.23.0') {
        transitive = false
    }
}

application {
    mainClass = 'zeroecho.pki.server.PkiServerMain'
    applicationName = 'zeroecho-pki-server'
}

// Explicit offline bootstrap; never invoked by the permanent server entrypoint.
def adminBootstrapScripts = tasks.register('adminBootstrapScripts', CreateStartScripts) {
    applicationName = 'zeroecho-pki-admin-bootstrap'
    mainClass = 'zeroecho.pki.server.PkiAdminBootstrap'
    outputDir = layout.buildDirectory.dir('admin-bootstrap-scripts').get().asFile
    classpath = tasks.named('startScripts').get().classpath
}
def rootAdminScripts = tasks.register('rootAdminScripts', CreateStartScripts) {
    applicationName = 'zeroecho-pki-root-admin'
    mainClass = 'zeroecho.pki.server.PkiRootAdmin'
    outputDir = layout.buildDirectory.dir('root-admin-scripts').get().asFile
    classpath = tasks.named('startScripts').get().classpath
}
def certificateAccessScripts = tasks.register('certificateAccessScripts', CreateStartScripts) {
    applicationName = 'zeroecho-pki-certificate-access'
    mainClass = 'zeroecho.pki.server.PkiCertificateAccess'
    outputDir = layout.buildDirectory.dir('certificate-access-scripts').get().asFile
    classpath = tasks.named('startScripts').get().classpath
}
def statusAccessScripts = tasks.register('statusAccessScripts', CreateStartScripts) {
    applicationName = 'zeroecho-pki-status-access'
    mainClass = 'zeroecho.pki.server.PkiStatusAccess'
    outputDir = layout.buildDirectory.dir('status-access-scripts').get().asFile
    classpath = tasks.named('startScripts').get().classpath
}
distributions {
    main {
        contents {
            from(statusAccessScripts) {
                into 'bin'
                filePermissions { unix('rwxr-xr-x') }
            }
            from(certificateAccessScripts) {
                into 'bin'
                filePermissions { unix('rwxr-xr-x') }
            }
            from(rootAdminScripts) {
                into 'bin'
                filePermissions { unix('rwxr-xr-x') }
            }
            from(adminBootstrapScripts) {
                into 'bin'
                filePermissions { unix('rwxr-xr-x') }
            }
        }
    }
}

tasks.named('test') {
    useJUnitPlatform { excludeTags 'frontend-integration', 'packaged-integration', 'certificate-scenario' }
    dependsOn tasks.named('installDist')
    def maintainedExamples = ['documentation', 'deploy'].collect { directory ->
        rootProject.fileTree(directory) {
            include '**/*.json', '**/*.yaml', '**/*.yml', '**/*.md'
        }
    }
    inputs.files(maintainedExamples).withPropertyName('maintainedConfigurationExamples')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    systemProperty 'configurationExamples.repository', rootProject.projectDir.absolutePath
    systemProperty 'serverSpi.distributionLib', layout.buildDirectory.dir('install/zeroecho-pki-server/lib').get().asFile.absolutePath
    systemProperty 'server.distributionDirectory', tasks.named('installDist').get().destinationDir.absolutePath
    systemProperty 'serverSpi.legacyBaseline', providers.gradleProperty('serverSpiLegacyBaseline').getOrElse('')
    jvmArgs("-javaagent:${configurations.mockitoAgent.singleFile}")
}

jar {
    manifest {
        attributes(
            'Main-Class': application.mainClass,
            'Implementation-Title': 'ZeroEcho PKI Server',
            'Implementation-Version': "${version}"
        )
    }
}

javadoc {
    dependsOn ':lib:javadoc', ':pki:javadoc'
    options.linksOffline("../lib/",
            project(':lib').layout.buildDirectory.dir('docs/javadoc').get().asFile.absolutePath)
    options.linksOffline("../pki/",
            project(':pki').layout.buildDirectory.dir('docs/javadoc').get().asFile.absolutePath)
}

tasks.register('generateSchema', JavaExec) {
    description = 'Generates the machine-readable operation parameter schema JSON and TypeScript artefact.'
    group = 'build'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'zeroecho.pki.server.schema.GenerateOperationSchema'
    def jsonOut = layout.buildDirectory.file('generated/schema/operationSchema.json').get().asFile
    def tsOut = layout.buildDirectory.file('generated/schema/operationSchema.generated.ts').get().asFile
    args jsonOut.absolutePath, tsOut.absolutePath
    inputs.files(sourceSets.main.output)
    outputs.files(jsonOut, tsOut)
}

// Explicit browser gate: ordinary JVM tests never require Node or a browser.
tasks.register('frontendIntegrationTest', Test) {
    description = 'Runs the built SPA against a temporary real PKI HTTPS backend.'
    group = 'verification'
    dependsOn tasks.named('testClasses'), ':pki-frontend:npmBuild'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'frontend-integration' }
    systemProperty 'frontend.directory', project(':pki-frontend').projectDir.absolutePath
    systemProperty 'frontend.browser', providers.gradleProperty('frontendBrowser').getOrElse('')
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
}

// Explicit distribution/container gate; no image pull or build occurs inside the test.
tasks.register('packagedIntegrationTest', Test) {
    description = 'Verifies packaged nginx, PKI server, SPA and CLI through real mTLS.'
    group = 'verification'
    dependsOn tasks.named('testClasses'), ':app:installDist'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'packaged-integration' }
    systemProperty 'packaged.repository', rootProject.projectDir.absolutePath
    systemProperty 'packaged.serverImage', providers.gradleProperty('packagedServerImage').getOrElse('localhost/zeroecho-pki-server:integration-test')
    systemProperty 'packaged.nginxImage', providers.gradleProperty('packagedNginxImage').getOrElse('localhost/zeroecho-pki-nginx:integration-test')
    systemProperty 'frontend.browser', providers.gradleProperty('frontendBrowser').getOrElse('')
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
}

// The frontend plugin may be applied after this project. Its callback runs during configuration.
def frontendProject = project(':pki-frontend')
def frontendNodeOverride = providers.gradleProperty('frontendNode')
frontendProject.plugins.withId('com.github.node-gradle.node') {
    def frontendNode = frontendProject.extensions.getByName('node')
    def frontendNodeExecutable = frontendNodeOverride.orElse(
            frontendNode.resolvedNodeDir.zip(frontendNode.resolvedPlatform) { directory, platform ->
                new File(directory.asFile, platform.isWindows() ? 'node.exe' : 'bin/node').absolutePath
            })
    ['frontendIntegrationTest', 'packagedIntegrationTest'].each { taskName ->
        tasks.named(taskName, Test) {
            def frontendArguments = objects.newInstance(FrontendTestArguments)
            frontendArguments.executable.set(frontendNodeExecutable)
            jvmArgumentProviders.add(frontendArguments)
        }
    }
}

// C04 native rehearsal: the external client uses only localhost HTTPS and its own keys.
tasks.register('certificateScenarioTest', Test) {
    group = 'verification'
    description = 'Rehearses approved certificate scenarios through the real external HTTPS client, without Podman.'
    dependsOn tasks.named('testClasses'), ':app:installDist'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'certificate-scenario' }
    testLogging { exceptionFormat = 'full' }
    systemProperty 'scenario.repository', rootProject.projectDir.absolutePath
    systemProperty 'scenario.cryptoClasspath', project(':app').layout.buildDirectory.dir('install/app/lib').get().asFile.absolutePath + '/*'
    maxParallelForks = 1
    outputs.upToDateWhen { false }
}
