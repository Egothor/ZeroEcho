/*
 * pki-frontend — the ZeroEcho PKI administration Single-Page Application.
 *
 * This is intentionally NOT a Java/JPMS module: it has no `module-info.java`,
 * no Java main sources, does not participate in the module graph, and is
 * unaffected by the `verifyBouncyCastleConfinement` gate. It wraps a pinned
 * JavaScript toolchain (Node + Vite) via the gradle-node-plugin and produces a
 * static SPA bundle (build/dist) that nginx serves at the deployment edge. It
 * compiles against nothing in `pki-server`; it consumes the HTTP admin API at
 * runtime only.
 *
 * The Node runtime is DOWNLOADED and pinned by the plugin (download = true), so
 * `./gradlew :pki-frontend:build` is self-contained and reproducible even on a
 * build host that has no system Node (e.g. the project's WSL build box).
 */
plugins {
    id 'base'
    id 'com.github.node-gradle.node' version '7.1.0'
}

node {
    // Pinned toolchain — reproducible builds, no reliance on a host Node.
    version = '22.11.0'
    npmVersion = '10.9.0'
    npmInstallCommand = 'ci'
    download = true
    // Keep the downloaded toolchain and node_modules inside the module.
    workDir = file("${projectDir}/.gradle/nodejs")
    npmWorkDir = file("${projectDir}/.gradle/npm")
    nodeProjectDir = file("${projectDir}")
}

// Reproducible, lockfile-exact install (fails if package-lock.json is stale).
tasks.named('npmInstall') {
    // Use `npm ci` semantics: exact, from the committed lockfile.
    inputs.file('package.json')
    inputs.file('package-lock.json')
    outputs.dir('node_modules')
}

def npmTypecheck = tasks.register('npmTypecheck', com.github.gradle.node.npm.task.NpmTask) {
    dependsOn tasks.named('npmInstall')
    args = ['run', 'typecheck']
    inputs.dir('src')
    inputs.file('tsconfig.json')
    inputs.file('package.json')
}

def npmLint = tasks.register('npmLint', com.github.gradle.node.npm.task.NpmTask) {
    dependsOn tasks.named('npmInstall')
    args = ['run', 'lint']
    inputs.dir('src')
    inputs.file('eslint.config.js')
}

def npmUnitTest = tasks.register('npmUnitTest', com.github.gradle.node.npm.task.NpmTask) {
    dependsOn tasks.named('npmInstall')
    args = ['run', 'test:ci']
    inputs.dir('src')
    inputs.dir('test')
}

def npmBuild = tasks.register('npmBuild', com.github.gradle.node.npm.task.NpmTask) {
    dependsOn tasks.named('npmInstall'), npmTypecheck
    args = ['run', 'build']
    inputs.dir('src')
    inputs.dir('public')
    inputs.file('index.html')
    inputs.file('vite.config.ts')
    inputs.file('tsconfig.json')
    inputs.file('package.json')
    inputs.file('package-lock.json')
    inputs.file(rootProject.file('LICENSE-binary.txt'))
    outputs.dir("${projectDir}/dist")
}

// The opt-in demo browser suite uses the built SPA and Vite preview by default.
// The real backend fixture is the separate :pki-server:frontendIntegrationTest task.
def npmE2e = tasks.register('npmE2e', com.github.gradle.node.npm.task.NpmTask) {
    dependsOn npmBuild
    args = ['run', 'test:e2e']
    onlyIf { project.hasProperty('runFrontendE2e') }
}

// Package the built SPA as a distributable archive (consumed by the container image).
def spaBundle = tasks.register('spaBundle', Zip) {
    dependsOn npmBuild
    archiveBaseName = 'zeroecho-pki-frontend'
    from("${projectDir}/dist")
    destinationDirectory = layout.buildDirectory.dir('distributions')
}

tasks.named('assemble') {
    dependsOn npmBuild, spaBundle
}

tasks.named('check') {
    dependsOn npmTypecheck, npmLint, npmUnitTest
}

tasks.named('clean') {
    delete "${projectDir}/dist"
    delete "${projectDir}/node_modules"
    delete "${projectDir}/.gradle/nodejs"
    delete "${projectDir}/.gradle/npm"
    delete "${projectDir}/coverage"
    delete "${projectDir}/playwright-report"
    delete "${projectDir}/test-results"
}
